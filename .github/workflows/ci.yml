name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-1-99:
    name: Rust 1.99 build and tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.99
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        env:
          CARGO_BUILD_WARNINGS: deny
        run: cargo check --locked --all-targets
      - name: Test
        run: cargo test --locked
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps


  python-tooling:
    name: Python tooling
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "latest-known"
      - name: Ruff
        run: uvx --from ruff==0.17.3 ruff check scripts
      - name: Generator tests
        run: uv run python -m unittest discover -s scripts/tests -p test_*.py -v

  strict-rust:
    name: Strict Rust
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@260a48d4b1cf65252f892b067fe41f44f05e653a # main
    with:
      ban-python-outside-ci: false
      allow-test-panics: true
