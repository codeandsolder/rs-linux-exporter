name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust-linux:
    name: Rust 1.99.1 Linux checks and tests
    permissions:
      contents: read
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@6b1adce9a7b2de91d50572fda04bed37c805f814 # main
    with:
      runner: ubuntu-26.04
      rust-toolchain: "1.99.1"
      rust-components: "clippy rustfmt"
      command: |
        cargo +1.99.1 fmt --all -- --check
        CARGO_BUILD_WARNINGS=deny cargo +1.99.1 check --locked --all-targets
        cargo +1.99.1 test --locked
        RUSTDOCFLAGS='-D warnings' cargo +1.99.1 doc --locked --no-deps

  python-tooling:
    name: Python tooling
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest-known"
      - name: Ruff
        run: uvx --from ruff==0.17.4 ruff check scripts
      - name: Generator tests
        run: uv run python -m unittest discover -s scripts/tests -p test_*.py -v

  strict-rust:
    name: Strict Rust
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@16c9a26e94f40c8f0d706fa6d9a4d207c1e2e78a # main
    with:
      ban-python-outside-ci: false
      allow-test-panics: true
