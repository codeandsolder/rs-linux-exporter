name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-1-99:
    name: Rust 1.99 build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.99
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        env:
          CARGO_BUILD_WARNINGS: deny
        run: cargo check --locked --all-targets
      - name: Test
        run: cargo test --locked
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - name: Packaging syntax
        run: |
          bash -n make_deb.sh
          dash -n packaging/postinst packaging/prerm packaging/postrm
          sed \
            -e 's#^WorkingDirectory=.*#WorkingDirectory=/#' \
            -e 's#^ExecStart=.*#ExecStart=/bin/true#' \
            packaging/rs-linux-exporter.service > /tmp/rs-linux-exporter.service
          systemd-analyze verify /tmp/rs-linux-exporter.service


  python-tooling:
    name: Python tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest-known"
      - name: Ruff
        run: uvx --from ruff==0.16.10 ruff check scripts
      - name: Generator tests
        run: uv run python -m unittest discover -s scripts/tests -p test_*.py -v

  rust-skills2:
    name: Strict Rust policy
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@main
    with:
      allow-test-panics: true
