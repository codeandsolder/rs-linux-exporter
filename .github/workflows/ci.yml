name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust-linux:
    name: Rust Linux checks and tests
    permissions:
      contents: read
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@ce8f8a2849c8cc0ce221e4cb283a4bef0de4a01a # main
    with:
      runner: ubuntu-26.04
      command: |
        cargo fmt --all -- --check
        CARGO_BUILD_WARNINGS=deny cargo check --locked --all-targets
        cargo test --locked
        RUSTDOCFLAGS='-D warnings' cargo doc --locked --no-deps

  python-tooling:
    name: Python tooling
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "latest-known"
      - name: Packaging and systemd unit syntax
        run: |
          dash -n packaging/postinst
          dash -n packaging/prerm
          dash -n packaging/postrm
          unit_dir=$(mktemp -d)
          trap 'rm -rf "$unit_dir"' EXIT
          sed -e 's#^WorkingDirectory=.*#WorkingDirectory=/#' \
              -e 's#^ExecStart=.*#ExecStart=/bin/true#' \
              packaging/rs-linux-exporter.service > "$unit_dir/rs-linux-exporter.service"
          systemd-analyze verify "$unit_dir/rs-linux-exporter.service"
      - name: Ruff
        run: uvx --from ruff==0.17.6 ruff check scripts
      - name: Generator tests
        run: uv run python -m unittest discover -s scripts/tests -p test_*.py -v

  strict-rust:
    name: Strict Rust
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@55ac92efe89656b085a0210b8cec4f1431d96406 # main
    with:
      ban-python-outside-ci: false
      allow-test-panics: true
