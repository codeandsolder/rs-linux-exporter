name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust-linux:
    name: Stable Rust Linux checks and tests
    permissions:
      contents: read
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@2376b14a6bc8263ab77013bd744248f49384b2fa # main
    with:
      runner: ubuntu-26.04
      rust-toolchain: "1.100.0"
      rust-components: "clippy rustfmt"
      command: |
        cargo fmt --all -- --check
        CARGO_BUILD_WARNINGS=deny cargo check --locked --all-targets
        cargo test --locked
        RUSTDOCFLAGS='-D warnings' cargo doc --locked --no-deps

  python-tooling:
    name: Python tooling
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "latest-known"
      - name: Ruff
        run: uvx --from ruff==0.17.6 ruff check scripts
      - name: Generator tests
        run: uv run python -m unittest discover -s scripts/tests -p test_*.py -v

  strict-rust:
    name: Strict Rust
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@82886ae85915af41ea90bf225bdffb3d9d359f69 # main
    with:
      ban-python-outside-ci: false
      allow-test-panics: true
