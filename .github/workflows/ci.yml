name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust-linux:
    name: Rust Linux checks and tests
    permissions:
      contents: read
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@8ec18b20d3af776db1eb8013ab1649acf35a289f # main
    with:
      runner: ubuntu-26.04
      command: |
        cargo fmt --all -- --check
        CARGO_BUILD_WARNINGS=deny cargo check --locked --workspace --all-targets
        cargo test --locked --workspace
        RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps

  packaging-syntax:
    name: Packaging and systemd syntax
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Packaging and systemd unit syntax
        run: |
          dash -n packaging/postinst
          dash -n packaging/prerm
          dash -n packaging/postrm
          unit_dir=$(mktemp -d)
          trap 'rm -rf "$unit_dir"' EXIT
          sed -e 's#^WorkingDirectory=.*#WorkingDirectory=/#' \
              -e 's#^ExecStart=.*#ExecStart=/bin/true#' \
              packaging/rs-linux-exporter.service > "$unit_dir/rs-linux-exporter.service"
          systemd-analyze verify "$unit_dir/rs-linux-exporter.service"

  strict-rust:
    name: Strict Rust
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@1f3c1fab9972ecc4c85329c9651dfbed138e6736 # main
    with:
      ban-python-outside-ci: true
      allow-test-panics: true
