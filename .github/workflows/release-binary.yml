name: release-binary

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux-x86_64-gnu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@2376b14a6bc8263ab77013bd744248f49384b2fa # main
      - name: Build release binary
        run: cargo build --release --locked
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@2376b14a6bc8263ab77013bd744248f49384b2fa # main
      - name: Package binary and checksum
        run: |
          install -d dist
          install -m 0755 target/release/rs-linux-exporter dist/rs-linux-exporter-x86_64-linux-gnu
          strip dist/rs-linux-exporter-x86_64-linux-gnu
          cd dist
          sha256sum rs-linux-exporter-x86_64-linux-gnu > rs-linux-exporter-x86_64-linux-gnu.sha256
      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rs-linux-exporter-x86_64-linux-gnu
          path: |
            dist/rs-linux-exporter-x86_64-linux-gnu
            dist/rs-linux-exporter-x86_64-linux-gnu.sha256
          if-no-files-found: error
      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            dist/rs-linux-exporter-x86_64-linux-gnu
            dist/rs-linux-exporter-x86_64-linux-gnu.sha256
