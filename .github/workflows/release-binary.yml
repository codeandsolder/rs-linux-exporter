name: release-binary

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux-x86_64-gnu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@7c04e549f943d270978b0302b278771ae6e2e40d # main
        with:
          rust-toolchain: "1.99.1"
      - name: Build release binary
        run: cargo +1.99.1 build --release --locked
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@7c04e549f943d270978b0302b278771ae6e2e40d # main
      - name: Package binary and checksum
        run: |
          install -d dist
          install -m 0755 target/release/rs-linux-exporter dist/rs-linux-exporter-x86_64-linux-gnu
          strip dist/rs-linux-exporter-x86_64-linux-gnu
          cd dist
          sha256sum rs-linux-exporter-x86_64-linux-gnu > rs-linux-exporter-x86_64-linux-gnu.sha256
      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rs-linux-exporter-x86_64-linux-gnu
          path: |
            dist/rs-linux-exporter-x86_64-linux-gnu
            dist/rs-linux-exporter-x86_64-linux-gnu.sha256
          if-no-files-found: error
      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          files: |
            dist/rs-linux-exporter-x86_64-linux-gnu
            dist/rs-linux-exporter-x86_64-linux-gnu.sha256
