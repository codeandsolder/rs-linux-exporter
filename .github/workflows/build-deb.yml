name: build-deb

on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deb-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      required: ${{ steps.detect.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Determine whether distribution builds are needed
        id: detect
        shell: bash
        run: |
          if [[ '${{ github.event_name }}' != 'pull_request' ]]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            status=0
            git diff --quiet '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}' -- \
              Cargo.toml Cargo.lock ':(glob)**/Cargo.toml' ':(glob)**/build.rs' \
              .cargo make_deb.sh rust-toolchain.toml packaging .github/workflows/build-deb.yml || status=$?
            case "$status" in
              0) echo 'required=false' >> "$GITHUB_OUTPUT" ;;
              1) echo 'required=true' >> "$GITHUB_OUTPUT" ;;
              *) exit "$status" ;;
            esac
          fi

  build:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: ubuntu-26.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu2204, image: 'ubuntu:22.04' }
          - { distro: ubuntu2404, image: 'ubuntu:24.04' }
          - { distro: ubuntu2604, image: 'ubuntu:26.04' }
          - { distro: debian12, image: 'debian:12' }
          - { distro: debian13, image: 'debian:13' }
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install target distribution build and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config dpkg-dev systemd tar zstd cmake clang libclang-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Trust the mounted checkout in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install current Node.js for shared CI actions
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Resolve the native quarantined compiler
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@5991b873ab28ec8fae36c2c8ef944a3f67f5f9b3 # main
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@5991b873ab28ec8fae36c2c8ef944a3f67f5f9b3 # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}
          cache-scope: deb-${{ matrix.distro }}
      - name: Build deb
        run: |
          bash -n make_deb.sh
          bash make_deb.sh
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@5991b873ab28ec8fae36c2c8ef944a3f67f5f9b3 # main
      - name: Test package install and upgrade
        run: |
          dpkg -i dist/*.deb
          systemctl is-enabled rs-linux-exporter.service
          systemd-analyze verify rs-linux-exporter.service
          printf '\n# local configuration marker\n' >> /etc/rs-linux-exporter/config.toml
          dpkg -i dist/*.deb
          systemctl is-enabled rs-linux-exporter.service
          systemctl disable rs-linux-exporter.service
          dpkg -i dist/*.deb
          test "$(systemctl is-enabled rs-linux-exporter.service || true)" = disabled
          systemctl enable rs-linux-exporter.service
          dpkg -r rs-linux-exporter
          test ! -L /etc/systemd/system/multi-user.target.wants/rs-linux-exporter.service
          test "$(tail -n 1 /etc/rs-linux-exporter/config.toml)" = '# local configuration marker'
          dpkg --purge rs-linux-exporter
          test ! -e /etc/rs-linux-exporter/config.toml
      - name: Upload deb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rs-linux-exporter-${{ matrix.distro }}-deb
          path: dist/*.deb
          if-no-files-found: error

  validate:
    name: Debian package validation
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-26.04
    steps:
      - name: Verify the required distribution build result
        shell: bash
        run: |
          test '${{ needs.changes.result }}' = success
          case '${{ needs.changes.outputs.required }}' in
            true) test '${{ needs.build.result }}' = success ;;
            false) test '${{ needs.build.result }}' = skipped ;;
            *) exit 1 ;;
          esac

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef3501313 # v7
        with:
          pattern: rs-linux-exporter-*-deb
          merge-multiple: true
          path: dist
      - name: Generate combined checksums
        run: |
          cd dist
          sha256sum *.deb > SHA256SUMS
      - name: Upload release assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            dist/*.deb
            dist/SHA256SUMS
