name: build-deb

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        distro: [ubuntu2204, ubuntu2404, ubuntu2604, debian12, debian13]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build deb
        run: |
          chmod +x ./make_deb.sh
          ./make_deb.sh "${{ matrix.distro }}"
      - name: Upload deb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rs-linux-exporter-${{ matrix.distro }}-deb
          path: dist/*.deb
          if-no-files-found: error
      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.deb > SHA256SUMS
      - name: Upload release assets (release event)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            dist/*.deb
            dist/SHA256SUMS
