name: bootstrap-crates-publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout exporter v0.1.15
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v0.1.15
          path: exporter-release
      - name: Checkout pinned lurkmoar 0.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: codeandsolder/lurkmoar-rs
          ref: eb22687dc167a86e923560935efc1234a9832e27
          path: lurkmoar-release
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@6b1adce9a7b2de91d50572fda04bed37c805f814 # main
        with:
          rust-toolchain: "1.99.1"
      - name: Publish pinned lurkmoar 0.1.0 if needed
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if cargo search lurkmoar --limit 1 | grep -q '^lurkmoar = "0.1.0"'; then
            echo 'lurkmoar 0.1.0 is already published'
          else
            cargo publish --manifest-path lurkmoar-release/Cargo.toml --locked
          fi
      - name: Add registry fallback metadata to exporter release manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('exporter-release/Cargo.toml')
          text = path.read_text()
          old = 'lurkmoar = { git = "https://github.com/codeandsolder/lurkmoar-rs", rev = "eb22687dc167a86e923560935efc1234a9832e27" }'
          new = 'lurkmoar = { version = "0.1.0", git = "https://github.com/codeandsolder/lurkmoar-rs", rev = "eb22687dc167a86e923560935efc1234a9832e27" }'
          if old not in text:
              raise SystemExit('expected v0.1.15 lurkmoar dependency not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Publish exporter v0.1.15
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          for attempt in {1..12}; do
            if cargo publish --manifest-path exporter-release/Cargo.toml --locked --allow-dirty; then
              exit 0
            fi
            echo "publish attempt ${attempt} failed; waiting for crates.io index propagation"
            sleep 5
          done
          exit 1
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@6b1adce9a7b2de91d50572fda04bed37c805f814 # main
