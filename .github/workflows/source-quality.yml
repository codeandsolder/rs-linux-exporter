name: Source quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-quality:
    uses: codeandsolder/ci-workflows/.github/workflows/source-quality.yml@2bf1fa8216c6b09836ea837d663ca616d0ec6427 # main
