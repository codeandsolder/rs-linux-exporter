[package]
name = "rs-linux-exporter"
version = "0.1.16"
edition = "2024"
rust-version = "1.100"
description = "Linux monitoring exporter"
repository = "https://github.com/nuclearcat/rs-linux-exporter"
readme = "README.md"
license = "LGPL-2.1-or-later"
keywords = ["prometheus", "exporter", "linux", "metrics", "monitoring"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
prometheus = { version = "0.14", default-features = false }
procfs = { version = "0.18", default-features = false }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time"] }
btls = { git = "https://github.com/codeandsolder/btls-fast.git", rev = "53c46285a85742dc8c3ab48fbb66613da6b4a297" }
tokio-btls = { git = "https://github.com/codeandsolder/btls-fast.git", rev = "53c46285a85742dc8c3ab48fbb66613da6b4a297" }
netlink-bindings = { version = "0.3.5", features = ["conntrack"] }
rustix = { version = "1.1", features = ["fs", "net", "system"] }
toml = "1.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
ipnet = "2"
ipmi-rs = { version = "0.6.0", default-features = false, features = ["unix-file"] }
subtle = "2.6"
wait-timeout = "0.2.1"
futures-util = "0.3.31"
zbus_systemd = { version = "0.26201.0", default-features = false, features = ["systemd1", "zbus-async-zruntime"] }
regex = "1"
rtime-clock = "0.16.0"
etc-os-release = { version = "0.2.0", features = ["date"] }
jiff = { version = "1", default-features = false, features = ["std"] }
lurkmoar = { version = "0.1.0", git = "https://github.com/codeandsolder/lurkmoar-rs", rev = "3cdf30cf748beffd2cec9078a8821d78f4912bef" }

[dev-dependencies]
hyper = { version = "1", features = ["client"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }
unexpected_cfgs = "warn"
unfulfilled_lint_expectations = "deny"
unused_results = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
await_holding_lock = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"

[patch.crates-io]
zlib-rs = { git = "https://github.com/codeandsolder/zlib-rs-fast.git", rev = "98f76b3a242099f2229b048360eeb4707246a68f" }

[workspace]
members = ["tools/metrics-tool"]
default-members = ["."]
resolver = "3"

[lints]
workspace = true
