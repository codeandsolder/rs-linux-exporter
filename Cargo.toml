[package]
name = "rs-linux-exporter"
version = "0.1.12"
edition = "2024"
rust-version = "1.99"
description = "Linux monitoring exporter"
repository = "https://github.com/nuclearcat/rs-linux-exporter"
readme = "README.md"
license = "LGPL-2.1-or-later"
keywords = ["prometheus", "exporter", "linux", "metrics", "monitoring"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
prometheus = "0.14"
procfs = "0.18"
rocket = { version = "0.5.0", features = ["tls"] }
netlink-bindings = { version = "0.3.5", features = ["conntrack"] }
rustix = { version = "1.1", features = ["fs", "net", "system"] }
toml = "1.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
ipnet = "2"
ipmi-rs = "0.6.0"
subtle = "2.6"
wait-timeout = "0.2.1"
systemd-zbus = { version = "5.3.2", default-features = false, features = ["blocking-api"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio", "blocking-api"] }
regex = "1"
rtime-clock = "0.15.1"
etc-os-release = { version = "0.1.1", features = ["date"] }
lurkmoar = { git = "https://github.com/codeandsolder/lurkmoar-rs", rev = "2b7249c52cbcc5c06dc6cbdfa3f73c80032eaa3d" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }
unexpected_cfgs = "warn"
unfulfilled_lint_expectations = "deny"
unused_results = "warn"
unused_qualifications = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
await_holding_lock = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
