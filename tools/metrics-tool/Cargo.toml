[package]
name = "rs-linux-exporter-metrics-tool"
version = "0.1.0"
edition = "2024"
publish = false
description = "Metric-schema and Grafana dashboard maintenance tooling"

[[bin]]
name = "metrics-tool"
path = "src/main.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
